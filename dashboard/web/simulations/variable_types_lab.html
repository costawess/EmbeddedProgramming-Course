  <style>
    :root {

      --panel: rgba(20, 36, 48, 0.94);
      --card: rgba(30, 50, 65, 0.96);

      --accent-soft: rgba(99, 196, 255, 0.14);
      --green: #2fc76b;
      --yellow: #ffcc45;
      --purple: #b98cff;
      --white: #f6fbff;

      --code-bg: #0d1720;

    }
    html:not(.theme-dark) {
      --bg: #eef5ff;
      --panel: rgba(255, 255, 255, 0.88);
      --card: rgba(248, 251, 255, 0.96);
      --line: #d4e3f4;
      --text: #244765;
      --subtle: #6f88a3;
      --accent: #2d86e6;
      --accent-soft: rgba(45, 134, 230, 0.14);
      --white: #244765;
      --button-bg: #f5f9ff;
      --code-bg: #f4f8fd;
      --shadow: 0 18px 42px rgba(48, 92, 145, 0.12);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Segoe UI", Arial, sans-serif; color: var(--text); background: radial-gradient(circle at top, #193549 0%, var(--bg) 58%, #081118 100%); }
    html:not(.theme-dark) body { background: radial-gradient(circle at top left, rgba(120, 180, 255, 0.18) 0%, transparent 28%), linear-gradient(180deg, #f8fbff 0%, var(--bg) 58%, #e8f1ff 100%); }
    .app { padding: 22px; display: grid; gap: 18px; }
    .header, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); }
    .header { padding: 18px 20px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; }
    .back { color: var(--text); text-decoration: none; border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px; background: var(--button-bg); font-weight: 800; }
    .brand-logo { width: 132px; max-width: 100%; height: auto; object-fit: contain; }
    .title h1 { margin: 0; font-size: clamp(28px, 3vw, 46px); }
    .title p { margin: 6px 0 0; color: var(--subtle); line-height: 1.45; }
    .layout { display: grid; grid-template-columns: minmax(230px, 290px) minmax(0, 1fr); gap: 18px; align-items: start; }
    .panel { padding: 18px; display: grid; gap: 14px; }
    .panel h2, .panel h3, .panel p { margin: 0; }
    .info-card, .code-card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 14px; display: grid; gap: 12px; }
    .card-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }

    .copy-btn:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--white); }
    .copy-btn.copied { border-color: var(--green); background: rgba(47, 199, 107, 0.14); }

    /* Left side: list of types */

    .type-group-title { color: var(--subtle); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
    .type-btn { appearance: none; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--button-bg); color: var(--text); font: 700 14px Consolas, "Courier New", monospace; cursor: pointer; text-align: left; }
    .type-btn small { font: 700 12px "Segoe UI", Arial, sans-serif; color: var(--subtle); white-space: nowrap; }

    /* Right side: information about the selected type */

    .type-meaning { color: var(--subtle); font-size: 16px; font-weight: 700; }
    .fact-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .fact-box { border-radius: 16px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); padding: 12px; display: grid; gap: 6px; align-content: start; }
    .fact-box strong { font-size: 13px; color: var(--subtle); }
    .fact-box span { color: var(--white); font-size: 19px; font-weight: 900; overflow-wrap: anywhere; }
    .fact-box small { color: var(--subtle); font-size: 13px; line-height: 1.35; }
    .info-text { color: var(--text); line-height: 1.5; }

    pre.code-block { margin: 0; padding: 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--code-bg); color: #d8f2ff; font-family: Consolas, "Courier New", monospace; font-size: 14px; line-height: 1.5; white-space: pre-wrap; user-select: text; -webkit-user-select: text; cursor: text; }
    .code-line { display: block; margin: 0 -6px; padding: 1px 6px; border-radius: 8px; }
    .code-line.active { background: rgba(99, 196, 255, 0.16); box-shadow: inset 3px 0 0 rgba(99, 196, 255, 0.9); color: var(--white); }
    html:not(.theme-dark) .fact-box { background: rgba(255, 255, 255, 0.72); }
    html:not(.theme-dark) pre.code-block { color: #355775; }
    @media (max-width: 1100px) { .fact-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .type-group { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .type-group-title { grid-column: 1 / -1; }

    @media (max-width: 760px) {
      .header { grid-template-columns: 1fr; }
      .fact-grid { grid-template-columns: 1fr; }

</head>
<body>
  <div class="app">
    <header class="header">
      <a class="back" href="../index.html">Back to menu</a>
      <div class="title">
        <h1>Variable Types</h1>
        <p>Select a variable type to see how much ESP32 memory it uses, which values it can hold, and an example of how to use it.</p>
      </div>
      <img class="brand-logo" src="../../assets/branding/hanze_logo.png" alt="Hanze logo" />
    </header>

    <section class="layout">
      <section class="panel">
        <h2>Variable type</h2>
        <div class="type-list" id="typeList"></div>
      </section>

      <section class="panel">
        <div class="info-card">
          <div>
            <div class="type-name" id="typeName">int</div>
            <div class="type-meaning" id="typeMeaning"></div>
          </div>
          <div class="fact-grid">
            <div class="fact-box"><strong>Size in ESP32 memory</strong><span id="factSize"></span><small id="factBits"></small></div>
            <div class="fact-box"><strong>Min</strong><span id="factMin"></span></div>
            <div class="fact-box"><strong>Max</strong><span id="factMax"></span><small id="factCount"></small></div>
            <div class="fact-box"><strong>Negative values</strong><span id="factSign"></span><small id="factSame"></small></div>
          </div>
          <p class="info-text" id="typeDescription"></p>
          <p class="info-text" id="typeUse"></p>
          <div class="board-note" id="boardNote"></div>
        </div>

        <div class="code-card">
          <div class="card-head">
            <h2>Code</h2>
            <button class="copy-btn" id="copyCodeBtn" type="button">Copy code</button>
          </div>
          <pre class="code-block" id="codeBlock"></pre>
        </div>
      </section>
    </section>
  </div>

  <script>
    // Sizes and ranges are the ones used by the ESP32 Arduino core.
    // min/max are strings so large values stay readable; signed says if negatives fit.
    const TYPE_GROUPS = [
      { title: "True / false", types: ["bool"] },
      { title: "Characters", types: ["char"] },
      { title: "Small integers", types: ["byte", "uint8", "int8"] },
      { title: "16-bit integers", types: ["ushort", "short", "uint16", "int16"] },
      { title: "32-bit integers", types: ["int", "uint", "long", "ulong", "int32", "uint32"] },
      { title: "Decimal numbers", types: ["float32"] }
    ];

    const TYPE_CONFIGS = {
      bool: {
        label: "bool",
        bytes: 1,
        min: "false (0)",
        max: "true (1)",
        count: "2 values",
        signed: false,
        meaning: "True or false",
        description: "A bool holds a logical value: true or false. It answers a yes/no question about your system.",
        use: "Flags such as buttonPressed, alarmEnabled, or systemReady.",
        note: "A bool reserves a whole byte, even though it only needs one bit.",
        example: `const int buttonPin = 35;
const int ledPin = 4;

bool buttonPressed = false;

void setup() {
  pinMode(buttonPin, INPUT);
  pinMode(ledPin, OUTPUT);
}

void loop() {
  buttonPressed = digitalRead(buttonPin);

  if (buttonPressed) {
    digitalWrite(ledPin, HIGH);
  } else {
    digitalWrite(ledPin, LOW);
  }
}`
      },
      char: {
        label: "char",
        bytes: 1,
        min: "0",
        max: "255",
        count: "256 values",
        signed: false,
        meaning: "One character",
        description: "A char stores one character, such as a letter or a digit, as its ASCII code. The letter 'A' is stored as the number 65.",
        use: "Letters, symbols, and commands received over serial.",
        note: "On the ESP32 a plain char is unsigned (0 to 255). On an Arduino Uno it is signed (-128 to 127). Use uint8_t or int8_t when you need a small number instead of a character.",
        example: `char command = 'S';

void setup() {
  Serial.begin(115200);
}

void loop() {
  if (Serial.available() > 0) {
    command = Serial.read();

    if (command == 'A') {
      Serial.println("Command A received");
    }
  }
}`
      },
      byte: {
        label: "byte",
        bytes: 1,
        min: "0",
        max: "255",
        count: "256 values",
        signed: false,
        meaning: "Arduino name for one byte",
        description: "byte is the Arduino name for an 8-bit value that is always positive.",
        use: "Bytes received over serial, PWM values, and small counters.",
        note: "",
        example: `byte received = 0;

void setup() {
  Serial.begin(115200);
}

void loop() {
  if (Serial.available() > 0) {
    received = Serial.read();

    Serial.print("Received: ");
    Serial.println(received);
  }
}`
      },
      uint8: {
        label: "uint8_t",
        bytes: 1,
        min: "0",
        max: "255",
        count: "256 values",
        signed: false,
        meaning: "Unsigned 8-bit integer",
        description: "uint8_t is a whole number that always uses exactly 8 bits and is never negative. The name tells you the size, on every board.",
        use: "PWM duty cycles (0 to 255), small counters, and data bytes.",
        note: "If you add 1 to 255, the value wraps around to 0.",
        example: `const int ledPin = 4;

uint8_t brightness = 0;

void setup() {
  pinMode(ledPin, OUTPUT);
}

void loop() {
  analogWrite(ledPin, brightness);

  brightness++;  // after 255 it wraps back to 0
  delay(10);
}`
      },
      int8: {
        label: "int8_t",
        bytes: 1,
        min: "-128",
        max: "127",
        count: "256 values",
        signed: true,
        meaning: "Signed 8-bit integer",
        description: "int8_t is a small whole number that can be positive or negative. Half of its values are used for negative numbers.",
        use: "Small offsets and corrections that can go below zero.",
        note: "",
        example: `int8_t offset = -3;

void setup() {
  Serial.begin(115200);
}

void loop() {
  int measured = 25;
  int corrected = measured + offset;

  Serial.println(corrected);  // prints 22
  delay(1000);
}`
      },
      ushort: {
        label: "unsigned short",
        bytes: 2,
        min: "0",
        max: "65535",
        count: "65,536 values",
        signed: false,
        meaning: "Unsigned short integer",
        description: "unsigned short is a whole number that uses 2 bytes and is never negative.",
        use: "ADC readings (0 to 4095 on the ESP32) and medium-sized counters.",
        note: "",
        example: `const int potPin = 32;

unsigned short reading = 0;

void setup() {
  Serial.begin(115200);
}

void loop() {
  reading = analogRead(potPin);  // 0 to 4095

  Serial.println(reading);
  delay(200);
}`
      },
      short: {
        label: "short",
        bytes: 2,
        min: "-32768",
        max: "32767",
        count: "65,536 values",
        signed: true,
        meaning: "Signed short integer",
        description: "short is a whole number that uses 2 bytes and can be positive or negative.",
        use: "Differences and errors that can be negative, such as setpoint minus measurement.",
        note: "",
        example: `short setpoint = 500;
short measured = 620;
short error = 0;

void setup() {
  Serial.begin(115200);
}

void loop() {
  error = setpoint - measured;

  Serial.println(error);  // prints -120
  delay(1000);
}`
      },
      uint16: {
        label: "uint16_t",
        bytes: 2,
        min: "0",
        max: "65535",
        count: "65,536 values",
        signed: false,
        meaning: "Unsigned 16-bit integer",
        description: "uint16_t is a whole number that always uses exactly 16 bits and is never negative. The name tells you the size, on every board.",
        use: "ADC samples, timer values, and sensor readings.",
        note: "",
        example: `const int potPin = 32;
const int ledPin = 4;

uint16_t adcValue = 0;

void setup() {
  pinMode(ledPin, OUTPUT);
}

void loop() {
  adcValue = analogRead(potPin);  // 0 to 4095

  if (adcValue > 2000) {
    digitalWrite(ledPin, HIGH);
  } else {
    digitalWrite(ledPin, LOW);
  }
}`
      },
      int16: {
        label: "int16_t",
        bytes: 2,
        min: "-32768",
        max: "32767",
        count: "65,536 values",
        signed: true,
        meaning: "Signed 16-bit integer",
        description: "int16_t is a whole number that always uses exactly 16 bits and can be positive or negative.",
        use: "Raw sensor values that can be negative, such as temperature or acceleration.",
        note: "",
        example: `int16_t temperatureTenths = -125;  // -12.5 degrees

void setup() {
  Serial.begin(115200);
}

void loop() {
  float temperature = temperatureTenths / 10.0;

  Serial.println(temperature, 1);  // prints -12.5
  delay(1000);
}`
      },
      int: {
        label: "int",
        bytes: 4,
        min: "-2147483648",
        max: "2147483647",
        count: "about 4.3 billion values",
        signed: true,
        meaning: "Whole number",
        description: "int is the everyday type for whole numbers. It can be positive or negative and is large enough for most calculations.",
        use: "Pin numbers, loop counters, and general calculations.",
        note: "On the ESP32 an int uses 4 bytes. On an Arduino Uno it uses only 2 bytes (-32,768 to 32,767).",
        example: `const int ledPin = 4;

int blinkCount = 3;

void setup() {
  pinMode(ledPin, OUTPUT);

  for (int i = 0; i < blinkCount; i++) {
    digitalWrite(ledPin, HIGH);
    delay(200);
    digitalWrite(ledPin, LOW);
    delay(200);
  }
}

void loop() {
}`
      },
      uint: {
        label: "unsigned int",
        bytes: 4,
        min: "0",
        max: "4294967295",
        count: "about 4.3 billion values",
        signed: false,
        meaning: "Whole number, never negative",
        description: "unsigned int is a whole number that is never negative, so it can count twice as high as an int.",
        use: "Counters that only go up, such as the number of button presses.",
        note: "On the ESP32 an unsigned int uses 4 bytes. On an Arduino Uno it uses only 2 bytes (0 to 65,535).",
        example: `const int buttonPin = 35;

unsigned int pressCount = 0;
bool lastButtonState = false;

void setup() {
  pinMode(buttonPin, INPUT);
  Serial.begin(115200);
}

void loop() {
  bool buttonPressed = digitalRead(buttonPin);

  if (buttonPressed && !lastButtonState) {
    pressCount++;
    Serial.println(pressCount);
  }

  lastButtonState = buttonPressed;
}`
      },
      long: {
        label: "long",
        bytes: 4,
        min: "-2147483648",
        max: "2147483647",
        count: "about 4.3 billion values",
        signed: true,
        meaning: "Large whole number",
        description: "long is a large whole number that can be positive or negative.",
        use: "Positions, large differences, and totals that can go below zero.",
        note: "On the ESP32 long and int have the same size. On an Arduino Uno a long is twice as large as an int.",
        example: `long target = 100000;
long current = 250000;
long difference = 0;

void setup() {
  Serial.begin(115200);
}

void loop() {
  difference = target - current;

  Serial.println(difference);  // prints -150000
  delay(1000);
}`
      },
      ulong: {
        label: "unsigned long",
        bytes: 4,
        min: "0",
        max: "4294967295",
        count: "about 4.3 billion values",
        signed: false,
        meaning: "Large whole number, never negative",
        description: "unsigned long is a large whole number that is never negative. It is the type returned by millis().",
        use: "Time measured with millis() and non-blocking timers.",
        note: "A millis() counter stored in an unsigned long wraps back to 0 after about 49.7 days.",
        example: `const int ledPin = 4;

unsigned long previousMillis = 0;
bool ledState = false;

void setup() {
  pinMode(ledPin, OUTPUT);
}

void loop() {
  unsigned long currentMillis = millis();

  if (currentMillis - previousMillis >= 500) {
    previousMillis = currentMillis;
    ledState = !ledState;
    digitalWrite(ledPin, ledState);
  }
}`
      },
      int32: {
        label: "int32_t",
        bytes: 4,
        min: "-2147483648",
        max: "2147483647",
        count: "about 4.3 billion values",
        signed: true,
        meaning: "Signed 32-bit integer",
        description: "int32_t is a whole number that always uses exactly 32 bits and can be positive or negative. The name tells you the size, on every board.",
        use: "Encoder positions and totals that can become large in both directions.",
        note: "",
        example: `int32_t position = 0;

void setup() {
  Serial.begin(115200);
}

void loop() {
  position = position - 40000;  // moving backwards

  Serial.println(position);
  delay(500);
}`
      },
      uint32: {
        label: "uint32_t",
        bytes: 4,
        min: "0",
        max: "4294967295",
        count: "about 4.3 billion values",
        signed: false,
        meaning: "Unsigned 32-bit integer",
        description: "uint32_t is a whole number that always uses exactly 32 bits and is never negative. The name tells you the size, on every board.",
        use: "Timestamps, large counters, and 32-bit data values.",
        note: "",
        example: `uint32_t lastPrint = 0;

void setup() {
  Serial.begin(115200);
}

void loop() {
  uint32_t now = millis();

  if (now - lastPrint >= 1000) {
    lastPrint = now;
    Serial.println(now);
  }
}`
      },
      float32: {
        label: "float",
        bytes: 4,
        min: "-3.4 × 10³⁸",
        max: "3.4 × 10³⁸",
        count: "about 6 to 7 significant digits",
        signed: true,
        meaning: "Number with decimals",
        description: "A float stores numbers with a fractional part, such as 3.3 or -12.5. It is precise to about 6 or 7 digits, so very small differences can be lost.",
        use: "Physical quantities such as voltage, temperature, or speed.",
        note: "Avoid comparing two floats with ==. Small rounding errors can make equal-looking values differ.",
        example: `const int potPin = 32;

float voltage = 0.0;

void setup() {
  Serial.begin(115200);
}

void loop() {
  int raw = analogRead(potPin);  // 0 to 4095
  voltage = raw * (3.3 / 4095.0);

  Serial.println(voltage, 2);  // two decimals
  delay(200);
}`
      }
    };

    const state = { typeId: "int" };

    const typeList = document.getElementById("typeList");
    const typeName = document.getElementById("typeName");
    const typeMeaning = document.getElementById("typeMeaning");
    const factSize = document.getElementById("factSize");
    const factBits = document.getElementById("factBits");
    const factMin = document.getElementById("factMin");
    const factMax = document.getElementById("factMax");
    const factCount = document.getElementById("factCount");
    const factSign = document.getElementById("factSign");
    const factSame = document.getElementById("factSame");
    const typeDescription = document.getElementById("typeDescription");
    const typeUse = document.getElementById("typeUse");
    const boardNote = document.getElementById("boardNote");
    const codeBlock = document.getElementById("codeBlock");
    const copyCodeBtn = document.getElementById("copyCodeBtn");

    function escapeHtml(value) {
      return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;");
    }

    function renderHighlightedCode(text, activeLines = []) {
      const normalized = String(text || "");
      const activeSet = new Set(activeLines);
      codeBlock.dataset.rawCode = normalized;
      codeBlock.innerHTML = normalized.split("\n").map((line, index) => {
        const safeLine = line.length ? escapeHtml(line) : "&nbsp;";
        return `<span class="code-line ${activeSet.has(index + 1) ? "active" : ""}">${safeLine}</span>`;
      }).join("");
    }

    // 1234567 -> "1,234,567"; text such as "true (1)" is returned unchanged.
    function formatNumber(text) {
      return /^-?\d+$/.test(text) ? text.replace(/\B(?=(\d{3})+(?!\d))/g, ",") : text;
    }

    function formatSize(bytes) {
      return `${bytes} byte${bytes > 1 ? "s" : ""}`;
    }

    // Other types that take the same space and hold the same values on the ESP32.
    function getEquivalentTypes(typeId) {
      const config = TYPE_CONFIGS[typeId];
      return Object.entries(TYPE_CONFIGS)
        .filter(([otherId, other]) => otherId !== typeId && other.bytes === config.bytes && other.min === config.min && other.max === config.max)
        .map(([, other]) => other.label);
    }

    // The lines of the example that declare a variable of the selected type.
    function getDeclarationLines(config) {
      const pattern = new RegExp(`^\\s*(?:const\\s+)?${config.label}\\s+\\w+`);
      return config.example.split("\n")
        .map((line, index) => pattern.test(line) ? index + 1 : 0)
        .filter(Boolean);
    }

    function renderTypeList() {
      typeList.innerHTML = TYPE_GROUPS.map(group => {
        const buttons = group.types.map(typeId => {
          const config = TYPE_CONFIGS[typeId];
          return `<button class="type-btn ${typeId === state.typeId ? "active" : ""}" type="button" data-type-id="${typeId}" aria-pressed="${typeId === state.typeId}">${config.label}<small>${formatSize(config.bytes)}</small></button>`;
        }).join("");
        return `<div class="type-group"><div class="type-group-title">${group.title}</div>${buttons}</div>`;
      }).join("");
    }

    function renderInfo() {
      const config = TYPE_CONFIGS[state.typeId];
      const equivalents = getEquivalentTypes(state.typeId);
      typeName.textContent = config.label;
      typeMeaning.textContent = config.meaning;
      factSize.textContent = formatSize(config.bytes);
      factBits.textContent = `${config.bytes * 8} bits`;
      factMin.textContent = formatNumber(config.min);
      factMax.textContent = formatNumber(config.max);
      factCount.textContent = config.count;
      factSign.textContent = config.signed ? "Yes (signed)" : "No (unsigned)";
      factSame.textContent = equivalents.length ? `Same size and range as: ${equivalents.join(", ")}` : "";
      typeDescription.textContent = config.description;
      typeUse.innerHTML = `<strong>Typical use:</strong> ${escapeHtml(config.use)}`;
      boardNote.textContent = config.note;
    }

    function renderCode() {
      const config = TYPE_CONFIGS[state.typeId];
      renderHighlightedCode(config.example, getDeclarationLines(config));
    }

    function renderAll() {
      renderTypeList();
      renderInfo();
      renderCode();
    }

    function selectType(typeId) {
      if (!TYPE_CONFIGS[typeId] || typeId === state.typeId) return;
      state.typeId = typeId;
      renderAll();
    }

    typeList.addEventListener("click", event => {
      const button = event.target.closest("[data-type-id]");
      if (button) selectType(button.dataset.typeId);
    });

    // Arrow up / down moves through the list of types.
    window.addEventListener("keydown", event => {
      if (document.activeElement && ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
      if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
      event.preventDefault();
      const order = TYPE_GROUPS.flatMap(group => group.types);
      const index = order.indexOf(state.typeId) + (event.key === "ArrowDown" ? 1 : -1);
      selectType(order[Math.min(order.length - 1, Math.max(0, index))]);
    });

    copyCodeBtn.addEventListener("click", async () => {
      const originalLabel = copyCodeBtn.textContent;
      try {
        await navigator.clipboard.writeText(codeBlock.dataset.rawCode || codeBlock.textContent);
        copyCodeBtn.textContent = "Copied";
        copyCodeBtn.classList.add("copied");
      } catch (error) {
        copyCodeBtn.textContent = "Copy failed";
      }
      window.setTimeout(() => {
        copyCodeBtn.textContent = originalLabel;
        copyCodeBtn.classList.remove("copied");
      }, 1400);
    });

    renderAll();
  </script>
  <script src="../shared/sound_fx.js"></script>
</body>
</html>
