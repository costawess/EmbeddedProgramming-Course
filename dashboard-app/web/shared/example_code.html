<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Example code</title>
  <style>
    :root { color-scheme: light dark; font-family: "Segoe UI", Arial, sans-serif; }
    body { max-width: 1100px; margin: 0 auto; padding: 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 28px; }
    a { color: inherit; }
    .code-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    button { font: inherit; padding: 8px 14px; border: 1px solid #788590; border-radius: 10px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    pre { border: 1px solid #788590; border-radius: 16px; padding: 20px; overflow: auto; line-height: 1.5; tab-size: 2; }
    #status { line-height: 1.5; }
  </style>
  <script>
    // This page follows the system colour scheme; ino_highlight.js picks its palette from this class.
    if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("theme-dark");
  </script>
</head>
<body>
  <header><h1 id="title">Example code</h1><a href="../index.html">Back to menu</a></header>
  <div class="code-actions">
    <a id="download" hidden download>Download .ino</a>
    <button id="copyCode" type="button" disabled>Copy code</button>
    <span id="copyStatus" role="status"></span>
  </div>
  <p id="status" role="status">Loading example code...</p>
  <pre><code id="code"></code></pre>
  <script src="ino_highlight.js"></script>
  <script>
    const sketches = {
      dual_elevator: "dual_elevator/esp32_dual_elevator_uart.ino",
      coffee_machine: "coffee_machine/esp32_coffee_machine_uart.ino",
      dual_seven_segment: "dual_seven_segment/esp32_dual_seven_segment_uart.ino",
      intersection_controller: "intersection_controller/esp32_intersection_controller_uart.ino",
      kitchen_timer: "kitchen_timer/esp32_kitchen_timer_uart.ino",
      maze: "maze/esp32_maze_uart.ino",
      tic_tac_toe: "tic_tac_toe/esp32_tic_tac_toe_bridge/esp32_tic_tac_toe_bridge.ino",
      traffic_lights: "traffic_lights/esp32_traffic_lights_uart.ino",
      heating_cooling_lab: "heating_cooling_lab/heating_cooling_lab.ino",
      real_time_challenge: "real_time_challenge/real_time_challenge.ino"
    };
    async function loadExample() {
      const experiment = new URLSearchParams(location.search).get("experiment");
      const path = Object.hasOwn(sketches, experiment) ? sketches[experiment] : null;
      const status = document.getElementById("status");
      if (!path) { status.textContent = "No example code is configured for this experiment."; return; }
      const title = experiment.replaceAll("_", " ").replace(/\b\w/g, letter => letter.toUpperCase());
      document.title = `${title} - Example code`;
      document.getElementById("title").textContent = `${title} - Example code`;
      const url = `../experiments/responses/${path}`;
      const download = document.getElementById("download");
      download.href = url;
      download.hidden = false;
      try {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const source = await response.text();
        highlightIno(document.getElementById("code"), source);
        document.getElementById("copyCode").disabled = false;
        status.textContent = path.split("/").pop();
      } catch (error) {
        status.textContent = "Could not load the sketch. Serve the dashboard through localhost or HTTPS, then reload. You can also use the Download .ino link.";
      }
    }
    document.getElementById("copyCode").addEventListener("click", async () => {
      const code = document.getElementById("code");
      const feedback = document.getElementById("copyStatus");
      try {
        await navigator.clipboard.writeText(code.textContent);
        feedback.textContent = "Code copied!";
      } catch (error) {
        const range = document.createRange();
        range.selectNodeContents(code);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        feedback.textContent = "Copy unavailable. Code selected: press Ctrl+C (Cmd+C on Mac).";
      }
    });
    loadExample();
  </script>
</body>
</html>
