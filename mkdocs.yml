site_name: Embedded Programming
site_description: Embedded Programming lectures, practical tutorials, and interactive ESP32 simulations at Hanze.
site_url: https://costawess.github.io/EmbeddedProgramming-Course/
repo_url: https://github.com/costawess/EmbeddedProgramming-Course
repo_name: EmbeddedProgramming-Course

theme:
  name: material
  language: en
  logo: assets/hanze_logo.png
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.magiclink
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mermaid2

hooks:
  - hooks/redirects.py

nav:
  - Home: index.md
  - Lectures:
      - Overview: lectures/index.md
      - Course & foundations:
          - Course organisation: lectures/course.md
          - How programs run: lectures/how-programs-run.md
          - The ESP32 family: lectures/esp32-introduction.md
          - Architecture & memory: lectures/architecture.md
      - Hardware & setup:
          - Pinout & electrical limits: lectures/pinout.md
          - The course board: lectures/course-board.md
          - Arduino IDE & first sketch: lectures/arduino-ide.md
      - Programming:
          - Variables, types & numbers: lectures/variables-types.md
          - Flowcharts: lectures/flowcharts.md
          - Functions & decisions: lectures/functions-decisions.md
          - Loops & arrays: lectures/loops-arrays.md
          - Structs: lectures/structs.md
          - Code quality & debugging: lectures/code-quality-debugging.md
      - Inputs, outputs & timing:
          - Digital inputs & outputs: lectures/digital-io.md
          - Analog input, PWM & DAC: lectures/analog-pwm.md
          - Timing, interrupts & timers: lectures/timing-interrupts.md
          - Breadboards & libraries: lectures/breadboard-libraries.md
      - Communication & behaviour:
          - Serial communication & UART: lectures/serial-uart.md
          - I2C: lectures/i2c.md
          - SPI & logic analysis: lectures/spi-logic-analyzer.md
          - State machines: lectures/state-machines.md
      - Connected systems & projects:
          - Wi-Fi & web: lectures/wifi-web.md
          - IoT, MQTT & BLE: lectures/iot-mqtt-ble.md
          - Storage, low power & OTA: lectures/storage-low-power-ota.md
          - Projects & best practices: lectures/projects-best-practices.md
      - References: lectures/references.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Getting started:
          - Arduino setup & GPIO: tutorials/arduino-setup-gpio/index.md
      - Programming fundamentals:
          - Variables & data types: tutorials/variables-types/index.md
          - Conditionals, switch & while: tutorials/conditionals-loops/index.md
      - Serial communication:
          - Reading serial input: tutorials/serial-input/index.md
      - Timing:
          - Hardware timer interrupts: tutorials/hardware-timers/index.md
  - Dashboard: https://costawess.github.io/Programming-Dashboard/web/index.html
