site_name: Embedded Programming
site_description: ESP32 workshops, interactive simulations, and experiments for Embedded Programming at Hanze.
site_url: https://costawess.github.io/EmbeddedProgramming-Course/
repo_url: https://github.com/costawess/EmbeddedProgramming-Course
repo_name: EmbeddedProgramming-Course

theme:
  name: material
  language: en
  logo: assets/hanze_logo.png
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.magiclink
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/dashboard.js

plugins:
  - search
  - mermaid2

hooks:
  - hooks/dashboard.py
watch:
  - dashboard

nav:
  - Home: index.md
  - Workshops:
      - workshops/index.md
      - Getting started:
          - "01 · Arduino IDE & Hello World": tutorials/tutorial1/ReadMe.md
      - Programming fundamentals:
          - "02 · Flowcharts & control flow": tutorials/tutorial2/ReadMe.md
          - "03 · Variables, types & loops": tutorials/tutorial3/ReadMe.md
      - Communication & sensors:
          - "04 · UART & ADC": tutorials/tutorial4/ReadMe.md
      - Timing & embedded systems:
          - "05 · Functions, interrupts & timers": tutorials/tutorial5/ReadMe.md
          - "06 · Kitchen timer": tutorials/tutorial6/ReadMe.md
          - "07 · I2C & state machines": tutorials/tutorial7/ReadMe.md
  - Dashboard: dashboard.md
